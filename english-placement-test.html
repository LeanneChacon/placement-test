<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Confidence and Connections — Placement Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&family=Noto+Sans:wght@400;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7FAF7;
    --card:#FFFFFF;
    --ink:#1F3A38;
    --text:#28322F;
    --text-soft:#6C7975;
    --line:#E1E9E4;
    --green:#71A943;
    --green-dark:#567F32;
    --teal:#178FAF;
    --teal-dark:#106C85;
    --sage:#71A943;
    --brick:#B5493F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Nunito Sans','Noto Sans Arabic','Noto Sans SC','Noto Sans',sans-serif;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 8% 6%, rgba(113,169,67,.13) 0%, transparent 38%),
      radial-gradient(circle at 96% 88%, rgba(23,143,175,.12) 0%, transparent 42%);
    background-attachment:fixed;
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:36px 16px 60px;
  }
  .app{width:100%;max-width:640px;}
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
    padding:0 4px;
  }
  .topbar .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Nunito Sans','Noto Sans Arabic','Noto Sans SC','Noto Sans',sans-serif;
    font-weight:600;
    font-size:16px;
    color:var(--ink);
  }
  .brand-mark{
    height:30px;
    width:auto;
    flex:none;
  }
  .strikes{display:flex;gap:7px;align-items:center;}
  .topbar-right{display:flex;align-items:center;gap:12px;}
  .lang-select{
    font-family:'Nunito Sans','Noto Sans Arabic','Noto Sans SC','Noto Sans',sans-serif;
    font-weight:700;
    font-size:12.5px;
    color:var(--ink);
    background:#fff;
    border:1.4px solid var(--line);
    border-radius:99px;
    padding:6px 12px;
    cursor:pointer;
    appearance:auto;
  }
  .strike-dot{
    width:10px;height:10px;border-radius:50%;
    border:1.6px solid #D8C9AE;
    background:transparent;
    transition:all .25s ease;
  }
  .strike-dot.filled{background:var(--brick);border-color:var(--brick);}

  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:42px 38px;
    box-shadow:0 12px 30px -14px rgba(31,58,56,.18);
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:-60px;right:-60px;
    width:170px;height:170px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(113,169,67,.16) 0%, transparent 70%);
    pointer-events:none;
  }
  @media (max-width:480px){.card{padding:30px 22px;}}

  h1.hero{
    font-family:'Nunito Sans','Noto Sans Arabic','Noto Sans SC','Noto Sans',sans-serif;
    font-weight:600;
    font-size:33px;
    line-height:1.22;
    margin:0 0 14px;
    color:var(--ink);
    letter-spacing:-.01em;
  }
  p.lede{font-size:16px;line-height:1.65;color:var(--text-soft);margin:0 0 26px;}

  .section-tag{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-family:'Nunito Sans','Noto Sans Arabic','Noto Sans SC','Noto Sans',sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--green-dark);
    background:rgba(113,169,67,.13);
    padding:6px 13px;
    border-radius:99px;
    margin-bottom:20px;
  }
  .section-tag.listening{color:var(--teal-dark);background:rgba(23,143,175,.13);}

  .rule-list{
    list-style:none;padding:0;margin:0 0 30px;
    display:grid;gap:12px;
  }
  .rule-list li{
    display:flex;gap:11px;font-size:14.5px;line-height:1.55;color:var(--text);
  }
  .rule-list li::before{
    content:"✦";color:var(--green);flex:none;font-size:12px;margin-top:2px;
  }
  .rule-list li.rule-highlight{
    background:rgba(23,143,175,.08);
    border:1.4px solid rgba(23,143,175,.25);
    border-radius:10px;
    padding:10px 12px;
    font-weight:700;
    color:var(--teal-dark);
  }
  .rule-list li.rule-highlight::before{content:"⚠";color:var(--teal-dark);}

  .name-label{
    display:block;
    font-family:'Nunito Sans',sans-serif;
    font-weight:700;
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--text-soft);
    margin-bottom:8px;
  }
  .name-input{
    display:block;
    width:100%;
    font-family:'Nunito Sans',sans-serif;
    font-size:15px;
    color:var(--text);
    background:#fff;
    border:1.6px solid var(--line);
    border-radius:12px;
    padding:12px 16px;
    margin-bottom:22px;
    box-sizing:border-box;
    transition:border-color .15s ease;
  }
  .name-input:focus{outline:none;border-color:var(--teal);}

  button.primary{
    background:var(--ink);
    color:#fff;
    border:none;
    font-family:'Nunito Sans','Noto Sans Arabic','Noto Sans SC','Noto Sans',sans-serif;
    font-weight:700;
    font-size:15.5px;
    padding:14px 28px;
    border-radius:99px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease, box-shadow .15s ease;
    box-shadow:0 6px 16px -6px rgba(31,58,56,.35);
  }
  button.primary:hover{background:#14302E; box-shadow:0 8px 18px -6px rgba(31,58,56,.42);}
  button.primary:active{transform:translateY(1px);}
  button.primary:disabled{background:#CFC2AF;cursor:not-allowed;box-shadow:none;}

  .qmeta{
    font-family:'Nunito Sans','Noto Sans Arabic','Noto Sans SC','Noto Sans',sans-serif;
    font-size:12px;
    color:var(--text-soft);
    margin-bottom:10px;
  }
  .passage{
    background:rgba(113,169,67,.08);
    border-left:3px solid var(--green);
    padding:15px 19px;
    font-size:15.5px;
    line-height:1.6;
    margin-bottom:20px;
    border-radius:0 12px 12px 0;
  }
  .listen-box{
    background:rgba(23,143,175,.08);
    border-left:3px solid var(--teal);
    padding:18px;
    margin-bottom:20px;
    border-radius:0 12px 12px 0;
    display:flex;
    align-items:center;
    gap:16px;
  }
  .play-btn{
    flex:none;
    width:48px;height:48px;
    border-radius:50%;
    border:none;
    background:var(--teal);
    color:#fff;
    font-size:18px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, transform .1s ease;
    box-shadow:0 6px 14px -6px rgba(23,143,175,.55);
  }
  .play-btn:hover{background:var(--teal-dark); transform:scale(1.04);}
  .play-btn.playing{background:var(--sage);}
  .play-btn:disabled{background:#C7CDCB;cursor:not-allowed;box-shadow:none;transform:none;}
  .listen-copy{font-size:13.5px;color:var(--text-soft);line-height:1.5;}
  .listen-copy b{color:var(--text);}
  .plays-left{
    font-size:12px;
    font-weight:700;
    color:var(--teal-dark);
    margin-top:6px;
  }
  .plays-left.depleted{color:var(--brick);}
  .audio-note{
    font-size:12px;
    color:var(--brick);
    line-height:1.5;
    margin:-10px 0 20px;
  }
  .audio-note code{
    background:rgba(181,73,63,.1);
    padding:1px 5px;
    border-radius:4px;
    font-family:monospace;
    font-size:11.5px;
  }

  .question{
    font-family:'Nunito Sans','Noto Sans Arabic','Noto Sans SC','Noto Sans',sans-serif;
    font-size:20px;
    font-weight:600;
    line-height:1.42;
    margin:0 0 20px;
    color:var(--ink);
  }
  .options{display:grid;gap:11px;margin-bottom:28px;}
  .option{
    display:flex;
    align-items:flex-start;
    gap:13px;
    border:1.6px solid var(--line);
    border-radius:14px;
    padding:14px 17px;
    cursor:pointer;
    font-size:15px;
    line-height:1.4;
    transition:border-color .12s ease, background .12s ease, transform .1s ease;
    background:#fff;
  }
  .option:hover{border-color:var(--green); transform:translateX(2px);}
  .option.selected{border-color:var(--ink);background:rgba(31,58,56,.05);}
  .option .letter{
    font-family:'Nunito Sans','Noto Sans Arabic','Noto Sans SC','Noto Sans',sans-serif;
    font-size:12px;
    font-weight:800;
    color:var(--text-soft);
    border:1.4px solid var(--line);
    border-radius:50%;
    width:23px;height:23px;
    flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .option.selected .letter{border-color:var(--ink);color:var(--ink);background:#fff;}
  .option-idk{
    margin-top:10px;
    border-style:dashed;
    color:var(--text-soft);
    font-style:italic;
  }
  .option-idk .letter{
    color:#fff;
    background:var(--text-soft);
    border-style:solid;
    border-color:var(--text-soft);
    font-style:normal;
    font-weight:800;
  }
  .option-idk.selected{border-style:solid;color:var(--text);}
  .option-idk.selected .letter{background:var(--ink);border-color:var(--ink);}

  .nav-row{display:flex;justify-content:flex-end;}

  .progress-rail{
    height:5px;background:var(--line);
    border-radius:99px;margin-bottom:28px;overflow:hidden;
  }
  .progress-fill{height:100%;background:linear-gradient(90deg, var(--green), var(--teal));transition:width .3s ease;border-radius:99px;}

  /* results */
  .level-name{
    font-family:'Nunito Sans','Noto Sans Arabic','Noto Sans SC','Noto Sans',sans-serif;
    font-size:32px;
    font-weight:700;
    color:var(--ink);
    margin:2px 0 6px;
  }
  .level-code{
    font-family:'Nunito Sans','Noto Sans Arabic','Noto Sans SC','Noto Sans',sans-serif;
    font-weight:800;
    font-size:12.5px;
    color:var(--green-dark);
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-bottom:16px;
  }
  .book-covers{
    display:block;
    max-width:280px;
    width:100%;
    height:auto;
    border-radius:12px;
    box-shadow:0 10px 24px -12px rgba(31,58,56,.35);
    margin:4px 0 18px;
  }
  .level-desc{font-size:15px;line-height:1.65;color:var(--text-soft);margin-bottom:28px;}

  .gauge{margin-bottom:30px;}
  .gauge-track{
    position:relative;
    height:12px;
    border-radius:99px;
    background:var(--line);
    overflow:visible;
    margin-bottom:10px;
  }
  .gauge-bands{position:absolute;inset:0;display:flex;border-radius:99px;overflow:hidden;}
  .gauge-bands span{flex:1;border-right:2px solid #fff;}
  .band-0{background:#E4EEDC;}
  .band-1{background:#CDE2BB;}
  .band-2{background:#AFD394;}
  .band-3{background:#8FC26E;}
  .band-4{background:#71A943;}
  .band-5{background:#4E9A88;}
  .band-6{background:#178FAF;}
  .gauge-marker{
    position:absolute;
    top:-6px;
    width:24px;height:24px;
    border-radius:50%;
    background:var(--ink);
    border:3px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
    transform:translateX(-50%);
    transition:left .5s ease;
  }
  .gauge-labels{
    display:flex;justify-content:space-between;
    font-family:'Nunito Sans','Noto Sans Arabic','Noto Sans SC','Noto Sans',sans-serif;
    font-weight:700;
    font-size:10.5px;
    color:var(--text-soft);
    letter-spacing:.03em;
  }

  .score-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:28px;
  }
  .score-box{
    border:1.6px solid var(--line);
    border-radius:14px;
    padding:17px 19px;
    background:#fff;
  }
  .score-box .label{
    font-family:'Nunito Sans','Noto Sans Arabic','Noto Sans SC','Noto Sans',sans-serif;
    font-weight:700;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--text-soft);
    margin-bottom:6px;
  }
  .score-box .val{font-family:'Nunito Sans','Noto Sans Arabic','Noto Sans SC','Noto Sans',sans-serif;font-size:25px;font-weight:700;color:var(--ink);}
  .score-box .val small{font-family:'Nunito Sans','Noto Sans Arabic','Noto Sans SC','Noto Sans',sans-serif;font-size:13px;font-weight:600;color:var(--text-soft);}

  .footnote{font-size:12.5px;color:var(--text-soft);line-height:1.6;}

  .share-block{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);}
  .share-heading{
    font-family:'Nunito Sans',sans-serif;
    font-weight:700;
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--text-soft);
    margin-bottom:12px;
  }
  .share-row{display:flex;flex-wrap:wrap;gap:10px;}
  .share-btn{
    background:#fff;
    border:1.6px solid var(--line);
    color:var(--ink);
    font-family:'Nunito Sans',sans-serif;
    font-weight:700;
    font-size:13.5px;
    padding:10px 18px;
    border-radius:99px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .share-btn:hover{border-color:var(--teal);background:rgba(23,143,175,.06);}
  .share-btn.primary-btn{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .share-btn.primary-btn:hover{background:#14302E;border-color:#14302E;}
  .share-note{
    font-size:12.5px;
    color:var(--green-dark);
    font-weight:700;
    margin-top:10px;
    height:14px;
    opacity:0;
    transition:opacity .2s ease;
  }
  .share-note.visible{opacity:1;}

  .fade-in{animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* RTL overrides (Arabic) — border accents don't flip automatically with dir="rtl" */
  html[dir="rtl"] .passage,
  html[dir="rtl"] .listen-box{
    border-left:none;
    border-right:3px solid var(--green);
    border-radius:12px 0 0 12px;
  }
  html[dir="rtl"] .listen-box{ border-right-color:var(--teal); }
  html[dir="rtl"] .rule-list li::before{ order:1; }
  html[dir="rtl"] .card::before{ left:-60px; right:auto; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="brand"><img class="brand-mark" src="intercambio-logo.png" alt="Intercambio">Confidence and Connections — Placement Test</span>
    <div class="topbar-right">
      <select class="lang-select" id="langSelect" onchange="setLang(this.value)" aria-label="Language"></select>
      <div id="topRight"></div>
    </div>
  </div>
  <div id="root"></div>
</div>

<script>

/* ---------------- CONTENT ---------------- */
const readingQuestions = [
  {level:"A1", question:"My ___________ is 195 Pine Street.", options:["address","house","direction","live"], answer:0},
  {level:"A1", question:"Today is Tuesday. Tomorrow is ___________.", options:["Monday","July","Wednesday","Friday"], answer:2},
  {level:"A1", question:"Her first name is Lucy. What's ___________ last name?", options:["she","their","his","her"], answer:3},
  {level:"A1", question:"I work at a restaurant. I am a ______________.", options:["teacher","cook","nurse","nanny"], answer:1},
  {level:"A1", question:"I'm wearing ___________.", options:["shoes blue","blue shoe","blue shoes","a blue shoes"], answer:2},
  {level:"A2", question:"This weekend, I'm going _________ a movie.", options:["to watch","seeing","watch","watching"], answer:0},
  {level:"A2", question:"When _____ the store open?", options:["do","does","are","to be"], answer:1},
  {level:"A2", question:"Can you ___________ weekends?", options:["work","works","to work","working"], answer:0},
  {level:"A2", question:"It's summer. The weather is ___________.", options:["cold","hot","snowy","sun"], answer:1},
  {level:"A2", question:"Did you pay the bill?", options:["Yes, I pay it.","No, I didn't pay them.","No, you didn't pay it.","Yes, I paid it."], answer:3},
  {level:"B1", question:"How much ___________ the rent?", options:["Is","does","are","be"], answer:0},
  {level:"B1", question:"When ___________?", options:["did they get married","they get married","they got married","do they got"], answer:0},
  {level:"B1", question:"Yesterday my brother ___________ a new car.", options:["buy","buyed","buys","bought"], answer:3},
  {level:"B1", question:"I ___________ going to Denver tomorrow.", options:["will","am","are","be"], answer:1},
  {level:"B1", question:"Next week, they ___________ begin their English course.", options:["are","do","are going to","will to"], answer:2},
  {level:"B1", question:"My little sister is ___________ than me.", options:["more young","younger","young","youngest"], answer:1},
  {level:"B1", question:"Is this hammer ________?", options:["my","me","I","mine"], answer:3},
  {level:"B2", question:"What will you do if she _____________ late?", options:["arrives","arrived","will arrive","arrive"], answer:0},
  {level:"B2", question:"Sorry I'm late. My car ___________.", options:["break into","broke down","broke into","breaks out"], answer:1},
  {level:"B2", question:"I'd like something ___________ my headache.", options:["of","to","for","in"], answer:2},
  {level:"B2", question:"Did you get ___________ in the mail?", options:["nothing","anyone","nobody","anything"], answer:3},
  {level:"B2", question:"That movie is very ______________. I loved it.", options:["boring","excited","exciting","bored"], answer:2},
  {level:"B2", question:"Oops! I brought my keys ___________ I forgot my wallet.", options:[". And",", or",", so",", but"], answer:3},
  {level:"B2", question:"Have they ever ___________ their house?", options:["paint","painting","paints","painted"], answer:3},
  {level:"C1", question:"Lola got a ticket. She ___________ and driving.", options:["be texting","texts","was texting","were texting"], answer:2},
  {level:"C1", question:"If you won a million dollars, ___________?", options:["what would you do","what will you do","what do you do","what did you do"], answer:0},
  {level:"C1", question:"It's hard _________________ to a new country.", options:["move","to move","moved","to moving"], answer:1},
  {level:"C1", question:"She has worked at the bank___________6 years.", options:["yet","since","for","until"], answer:2},
  {level:"C1", question:"You play tennis very well. You ____ practice a lot.", options:["might","must","can","are"], answer:1},
  {level:"C1", question:"Are you ___________ at the supermarket? You've been there for two hours!", options:["yet","anymore","still","stay"], answer:2},
  {level:"C1", question:"I ________ swimming for 2 years.", options:["have been","has been","been","have"], answer:0},
  {level:"C1", question:"She _______ a noise while she was doing her homework.", options:["hearing","heard","hear","hears"], answer:1},
  {level:"C1", question:"He's going to invest in the retirement plan ___________ he wants to save money.", options:["unless","to","even though","because"], answer:3}
];

// AUDIO FILES: the spoken prompt for each item is the audio itself (there is
// no written question stem) — students hear the prompt, then pick the
// response that fits. Files use your original names (Question_01.m4a, etc.)
// and must live in an "audio" folder next to this HTML file.
const listeningQuestions = [
  {audioFile:"audio/Question_01.mp3", question:"Listen, then choose the best response.", options:["Yes, it does.","No, she isn't","No, it isn't."], answer:2},
  {audioFile:"audio/Question_02.mp3", question:"Listen, then choose the best response.", options:["I don't.","Yes, I can.","They dance."], answer:1},
  {audioFile:"audio/Question_03.mp3", question:"Listen, then choose the best response.", options:["Leo has pants brown and a sweater green.","Leo has brown pants and a green sweater.","It is green."], answer:1},
  {audioFile:"audio/Question_04.mp3", question:"Listen, then choose the best response.", options:["No, it isn't.","It will be cold tomorrow.","It is sunny, but windy."], answer:2},
  {audioFile:"audio/Question_05.mp3", question:"Listen, then choose the best response.", options:["Yes, I am.","No, I don't.","Yes, you are."], answer:0},
  {audioFile:"audio/Question_06.mp3", question:"Listen, then choose the best response.", options:["At 6 p.m.","Yes, they do.","At a restaurant."], answer:0},
  {audioFile:"audio/Question_07.mp3", question:"Listen, then choose the best response.", options:["When I was a child.","I grew up in South America.","I grow up at Mexico."], answer:1},
  {audioFile:"audio/Question_08.mp3", question:"Listen, then choose the best response.", options:["She sleeps.","I am sleeping.","She is sleeping."], answer:2},
  {audioFile:"audio/Question_09.mp3", question:"Listen, then choose the best response.", options:["He was swimming.","He swims.","He swam."], answer:0},
  {audioFile:"audio/Question_10.mp3", question:"Listen, then choose the best response.", options:["No, I won't.","I go to the BBQ.","I'll cancel the BBQ."], answer:2},
  {audioFile:"audio/Question_11.mp3", question:"Listen, then choose the best response.", options:["I play tennis.","I used to play tennis.","I'm going to play."], answer:1},
  {audioFile:"audio/Question_12.mp3", question:"Listen, then choose the best response.", options:["It's hers.","It's her.","They're hers."], answer:2},
  {audioFile:"audio/Question_13.mp3", question:"Listen, then choose the best response.", options:["To work nights makes him tired.","Working nights makes him tired.","Yes, he's tired."], answer:1},
  {audioFile:"audio/Question_14.mp3", question:"Listen, then choose the best response.", options:["Sure, I can do that.","Sorry, I don't.","Yes, I pick up your mail."], answer:0},
  {audioFile:"audio/Question_15.mp3", question:"Listen, then choose the best response.", options:["She has had it since 2 hours.","She has it for 2 hours.","She has had it for 2 hours."], answer:2},

const LANG_ORDER = ["en","es","fr","pt","ru","uk","ar","zh"];

/* ---------------- STATE ---------------- */
let state = {
  screen:"intro", // intro | reading | listeningIntro | listening | results
  rIndex:0, rWrong:0, rScore:0, rAnswered:0,
  lIndex:0, lWrong:0, lScore:0, lAnswered:0,
  selected:null,
  locked:false,
  hasPlayed:false,
  playCount:0,
  lang:"en",
  studentName:"",
  studentEmail:"",
  resultsSubmitted:false
};

function levelFor(score){
  for(const l of LEVELS){ if(score>=l.min && score<=l.max) return l; }
  return LEVELS[LEVELS.length-1];
}

/* ---------------- TRANSLATION HELPERS ---------------- */
function t(key){
  const dict = translations[state.lang] || translations.en;
  return (key in dict) ? dict[key] : translations.en[key];
}
function tLevel(code){
  const dict = translations[state.lang] || translations.en;
  const entry = (dict.levels && dict.levels[code]) || translations.en.levels[code];
  return entry;
}
function populateLangSelect(){
  const sel = document.getElementById('langSelect');
  if(!sel || sel.options.length) return;
  LANG_ORDER.forEach(code=>{
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = translations[code].langName;
    if(code===state.lang) opt.selected = true;
    sel.appendChild(opt);
  });
}
function setLang(lang){
  if(!translations[lang]) return;
  state.lang = lang;
  const dir = translations[lang].dir === 'rtl' ? 'rtl' : 'ltr';
  document.documentElement.dir = dir;
  document.documentElement.lang = lang;
  const sel = document.getElementById('langSelect');
  if(sel) sel.value = lang;
  rerenderCurrentScreen();
}
function rerenderCurrentScreen(){
  switch(state.screen){
    case "intro": renderIntro(); break;
    case "readingIntro": renderSectionIntro("reading"); break;
    case "listeningIntro": renderSectionIntro("listening"); break;
    case "reading": case "listening": renderQuestion(); break;
    case "results": renderResults(); break;
    default: renderIntro();
  }
}

/* ---------------- RENDER HELPERS ---------------- */
const root = document.getElementById('root');
const topRight = document.getElementById('topRight');

function renderStrikes(wrong, cls){
  let html = '<div class="strikes">';
  for(let i=0;i<3;i++){
    html += `<div class="strike-dot ${i<wrong?'filled':''}"></div>`;
  }
  html += '</div>';
  return html;
}

function letters(i){ return ['A','B','C','D'][i]; }

/* ---------------- SCREENS ---------------- */
function renderIntro(){
  topRight.innerHTML = '';
  populateLangSelect();
  root.innerHTML = `
  <div class="card fade-in">
    <span class="section-tag">${t('placementTestTag')}</span>
    <h1 class="hero">${t('introHero')}</h1>
    <img class="book-covers" src="confidence-connections-books.jpg" alt="Confidence and Connections book series">
    <p class="lede">${t('introLede')}</p>
    <ul class="rule-list">
      <li>${t('ruleReading')}</li>
      <li>${t('ruleListening')}</li>
      <li>${t('ruleStop')}</li>
      <li>${t('ruleNoBack')}</li>
      <li>${t('ruleTime')}</li>
      <li class="rule-highlight">${t('ruleDontGuess')}</li>
    </ul>
    <label class="name-label" for="studentNameInput">${t('yourNameLabel')}</label>
    <input type="text" id="studentNameInput" class="name-input" placeholder="${t('yourNamePlaceholder')}"
      value="${state.studentName.replace(/"/g,'&quot;')}"
      oninput="state.studentName=this.value; document.getElementById('startBtn').disabled = !this.value.trim();">
    <label class="name-label" for="studentEmailInput">${t('yourEmailLabel')}</label>

      value="${state.studentEmail.replace(/"/g,'&quot;')}"
      oninput="state.studentEmail=this.value;">
    <button class="primary" id="startBtn" ${state.studentName.trim()?'':'disabled'} onclick="startReading()">${t('startTest')}</button>
  </div>`;
}

function renderSectionIntro(kind){
  topRight.innerHTML = '';
  populateLangSelect();
  const isListening = kind==="listening";
  root.innerHTML = `
  <div class="card fade-in">
    <span class="section-tag ${isListening?'listening':''}">${isListening?t('part2Listening'):t('part1Reading')}</span>
    <h1 class="hero">${isListening?t('listeningSectionTitle'):t('readingSectionTitle')}</h1>
    <p class="lede">${isListening?t('listeningSectionLede'):t('readingSectionLede')}</p>
    <button class="primary" onclick="${isListening?'startListening()':'goToQuestion()'}">${isListening?t('startListeningSection'):t('begin')}</button>
  </div>`;
}

function renderQuestion(){
  const isListening = state.screen==="listening";
  const bank = isListening ? listeningQuestions : readingQuestions;
  const idx = isListening ? state.lIndex : state.rIndex;
  const wrong = isListening ? state.lWrong : state.rWrong;
  const q = bank[idx];
  const ptsShort = isListening ? t('listeningPtsShort') : t('readingPtsShort');

  topRight.innerHTML = renderStrikes(wrong);
  populateLangSelect();

  const progressPct = Math.round((idx/bank.length)*100);

  let mediaHtml = '';
  if(isListening){
    const playsLeft = Math.max(0, 2 - state.playCount);
    const limitReached = playsLeft <= 0;
    mediaHtml = `
      <div class="listen-box">
        <button class="play-btn" id="playBtn" onclick="playAudio()" ${limitReached?'disabled':''}>▶</button>
        <div class="listen-copy">
          <b>${t('pressPlayBold')}</b> ${t('pressPlayRest')}
          <div class="plays-left ${limitReached?'depleted':''}">${t('playsLeftLabel').replace('{n}', playsLeft)}</div>
        </div>
      </div>
      <div class="audio-note" id="audioNote"></div>`;
  } else if(q.passage){
    mediaHtml = `<div class="passage">${q.passage}</div>`;
  }

  const idkIndex = q.options.length;
  const optionsHtml = q.options.map((opt,i)=>`
    <div class="option ${state.selected===i?'selected':''}" onclick="selectOption(${i})">
      <span class="letter">${letters(i)}</span>
      <span>${opt}</span>
    </div>`).join('') + `
    <div class="option option-idk ${state.selected===idkIndex?'selected':''}" onclick="selectOption(${idkIndex})">
      <span class="letter">?</span>
      <span>${t('idontknow')}</span>
    </div>`;

  const questionText = isListening ? t('listenPrompt') : q.question;

  root.innerHTML = `
  <div class="card fade-in">
    <span class="section-tag ${isListening?'listening':''}">${isListening?t('listeningLabel'):t('readingLabel')} · Q${idx+1} · ${ptsShort}</span>
    <div class="progress-rail"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    ${mediaHtml}
    <div class="question">${questionText}</div>
    <div class="options">${optionsHtml}</div>
    <div class="nav-row">
      <button class="primary" id="nextBtn" ${state.selected===null?'disabled':''} onclick="submitAnswer()">
        ${state.locked ? t('next') : t('submitAnswer')}
      </button>
    </div>
  </div>`;

  if(isListening){ state.hasPlayed=false; }
}

function renderResults(){
  topRight.innerHTML = '';
  populateLangSelect();
  submitResultsToSheet();
  const total = state.rScore + state.lScore;
  const lvl = levelFor(total);
  const lvlText = tLevel(lvl.code);
  const pct = Math.min(100, Math.round((total/MAX_POSSIBLE)*100));
  const rMax = state.rAnswered*READING_POINTS;
  const lMax = state.lAnswered*LISTENING_POINTS;

  const bandsHtml = LEVELS.map((l,i)=>`<span class="band-${i}"></span>`).join('');
  const labelsHtml = LEVELS.map(l=>`<span>${l.code}</span>`).join('');

  root.innerHTML = `
  <div class="card fade-in">
    <span class="section-tag">${t('results')}</span>
    <img class="book-covers" src="confidence-connections-books.jpg" alt="Confidence and Connections book series">
    <div class="level-code">${lvl.code} · ${t('suggestedPlacement')}</div>
    <div class="level-name">${lvlText.name}</div>
    <p class="level-desc">${lvlText.desc}</p>

    <div class="gauge" dir="ltr">
      <div class="gauge-track">
        <div class="gauge-bands">
          ${bandsHtml}
        </div>
        <div class="gauge-marker" style="left:${pct}%"></div>
      </div>
      <div class="gauge-labels">
        ${labelsHtml}
      </div>
    </div>

    <div class="score-grid">
      <div class="score-box">
        <div class="label">${t('readingLabel')}</div>
        <div class="val">${state.rScore} <small>/ ${rMax} ${t('ptsUnit')}</small></div>
      </div>
      <div class="score-box">
        <div class="label">${t('listeningLabel')}</div>
        <div class="val">${state.lScore} <small>/ ${lMax} ${t('ptsUnit')}</small></div>
      </div>
      <div class="score-box">
        <div class="label">${t('combinedScore')}</div>
        <div class="val">${total} <small>/ ${MAX_POSSIBLE} ${t('ptsUnit')}</small></div>
      </div>
      <div class="score-box">
        <div class="label">${t('questionsAnswered')}</div>
        <div class="val">${state.rAnswered + state.lAnswered} <small>${t('totalUnit')}</small></div>
      </div>
    </div>

    <p class="footnote">${t('footnote')}</p>

    <div class="share-block">
      <div class="share-heading">${t('shareHeading')}</div>
      <div class="share-row">
        <button class="share-btn" onclick="emailResults()">${t('emailResultsBtn')}</button>
        <button class="share-btn" onclick="copyResults()">${t('copyResultsBtn')}</button>
        ${(typeof navigator!=='undefined' && navigator.share) ? `<button class="share-btn" onclick="shareResults()">${t('shareResultsBtn')}</button>` : ''}
      </div>
      <div class="share-row" style="margin-top:10px;">
        <button class="share-btn primary-btn" onclick="downloadCertificate()">${t('downloadCertificateBtn')}</button>
        ${(typeof navigator!=='undefined' && navigator.canShare) ? `<button class="share-btn" onclick="shareCertificateFile()">${t('shareCertificateBtn')}</button>` : ''}
      </div>
      <div class="share-note" id="shareNote"></div>
    </div>
    <canvas id="certCanvas" width="1600" height="1120" style="display:none;"></canvas>
  </div>`;
}

function submitResultsToSheet(){
  if(state.resultsSubmitted) return;
  state.resultsSubmitted = true;

  const total = state.rScore + state.lScore;
  const lvl = levelFor(total);
  const lvlText = tLevel(lvl.code);
  const rMax = state.rAnswered*READING_POINTS;
  const lMax = state.lAnswered*LISTENING_POINTS;

  const payload = {
    name: state.studentName.trim(),
    email: state.studentEmail.trim(),
    language: state.lang,
    levelCode: lvl.code,
    levelName: lvlText.name,
    readingScore: state.rScore,
    readingMax: rMax,
    listeningScore: state.lScore,
    listeningMax: lMax,
    combinedScore: total,
    maxPossible: MAX_POSSIBLE,
    questionsAnswered: state.rAnswered + state.lAnswered
  };

  // fire-and-forget: Apps Script web apps don't return CORS headers, so we
  // use no-cors mode and never read the response. Any network failure here
  // is swallowed silently — it must never interrupt the student's results screen.
  try{
    fetch(SHEET_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).catch(()=>{});
  }catch(e){}
}

function buildResultsSummary(){
  const total = state.rScore + state.lScore;
  const lvl = levelFor(total);
  const lvlText = tLevel(lvl.code);
  const rMax = state.rAnswered*READING_POINTS;
  const lMax = state.lAnswered*LISTENING_POINTS;
  const lines = [
    `${t('yourNameLabel')}: ${state.studentName.trim() || '—'}`,
    `${t('yourEmailLabel')}: ${state.studentEmail.trim() || '—'}`,
    '',
    `${t('suggestedPlacement')}: ${lvlText.name} (${lvl.code})`,
    '',
    `${t('readingLabel')}: ${state.rScore} / ${rMax} ${t('ptsUnit')}`,
    `${t('listeningLabel')}: ${state.lScore} / ${lMax} ${t('ptsUnit')}`,
    `${t('combinedScore')}: ${total} / ${MAX_POSSIBLE} ${t('ptsUnit')}`,
    `${t('questionsAnswered')}: ${state.rAnswered + state.lAnswered}`,
    '',
    t('footnote')
  ];
  return lines.join('\n');
}

function emailResults(){
  const subject = encodeURIComponent(t('emailSubject'));
  const body = encodeURIComponent(buildResultsSummary());
  window.location.href = `mailto:?subject=${subject}&body=${body}`;
}

function showShareNote(msg){
  const el = document.getElementById('shareNote');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('visible');
  clearTimeout(window.__shareNoteTimer);
  window.__shareNoteTimer = setTimeout(()=>{ el.classList.remove('visible'); }, 2500);
}

function copyResults(){
  const text = buildResultsSummary();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(()=>showShareNote(t('copiedConfirmation')))
      .catch(()=>fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); showShareNote(t('copiedConfirmation')); }catch(e){}
  document.body.removeChild(ta);
}

function shareResults(){
  if(!navigator.share) return;
  navigator.share({ title: t('emailSubject'), text: buildResultsSummary() }).catch(()=>{});
}

/* ---------------- CERTIFICATE ---------------- */
let __logoImg = null;
function loadLogoImage(){
  return new Promise((resolve)=>{
    if(__logoImg){ resolve(__logoImg); return; }
    const img = new Image();
    img.onload = ()=>{ __logoImg = img; resolve(img); };
    img.onerror = ()=>{ resolve(null); };
    img.src = 'intercambio-logo.png';
  });
}

function drawCertificate(){
  const total = state.rScore + state.lScore;
  const lvl = levelFor(total);
  const lvlText = tLevel(lvl.code);
  const isRTL = translations[state.lang] && translations[state.lang].dir === 'rtl';
  const dateStr = new Date().toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });

  const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();

  return fontsReady.then(loadLogoImage).then((logo)=>{
    const canvas = document.getElementById('certCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // background
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0,0,W,H);

    // outer border
    ctx.strokeStyle = '#71A943';
    ctx.lineWidth = 10;
    ctx.strokeRect(28,28,W-56,H-56);
    ctx.strokeStyle = '#178FAF';
    ctx.lineWidth = 3;
    ctx.strokeRect(50,50,W-100,H-100);

    ctx.textAlign = 'center';
    ctx.direction = isRTL ? 'rtl' : 'ltr';

    // logo
    if(logo){
      const logoW = 260, logoH = logoW * (logo.height/logo.width);
      ctx.drawImage(logo, W/2 - logoW/2, 95, logoW, logoH);
    }

    // title
    ctx.fillStyle = '#1F3A38';
    ctx.font = "600 46px 'Nunito Sans', sans-serif";
    ctx.fillText(t('certificateTitle'), W/2, 300);

    // intro line
    ctx.fillStyle = '#6C7975';
    ctx.font = "600 22px 'Nunito Sans', sans-serif";
    ctx.fillText(t('certificateIntro'), W/2, 400);

    // student name
    ctx.fillStyle = '#1F3A38';
    ctx.font = "700 64px 'Nunito Sans', sans-serif";
    let name = state.studentName.trim() || '—';
    // shrink font if the name is very long
    let nameSize = 64;
    ctx.font = `700 ${nameSize}px 'Nunito Sans', sans-serif`;
    while(ctx.measureText(name).width > W-260 && nameSize > 30){
      nameSize -= 2;
      ctx.font = `700 ${nameSize}px 'Nunito Sans', sans-serif`;
    }
    ctx.fillText(name, W/2, 480);

    // underline
    const lineW = Math.min(560, ctx.measureText(name).width + 80);
    ctx.strokeStyle = '#D9971E';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W/2 - lineW/2, 505);
    ctx.lineTo(W/2 + lineW/2, 505);
    ctx.stroke();

    // placement line
    ctx.fillStyle = '#6C7975';
    ctx.font = "600 22px 'Nunito Sans', sans-serif";
    ctx.fillText(t('certificatePlacementText'), W/2, 570);

    // level badge
    ctx.fillStyle = '#178FAF';
    ctx.font = "700 52px 'Nunito Sans', sans-serif";
    ctx.fillText(`${lvlText.name} (${lvl.code})`, W/2, 640);

    // score line
    ctx.fillStyle = '#6C7975';
    ctx.font = "600 20px 'Nunito Sans', sans-serif";
    ctx.fillText(`${t('combinedScore')}: ${total} / ${MAX_POSSIBLE} ${t('ptsUnit')}`, W/2, 690);

    // date + program footer
    ctx.font = "600 18px 'Nunito Sans', sans-serif";
    ctx.fillText(`${t('certificateDateLabel')}: ${dateStr}`, W/2, 950);
    ctx.fillStyle = '#8C9997';
    ctx.font = "700 15px 'Nunito Sans', sans-serif";
    ctx.fillText('CONFIDENCE AND CONNECTIONS — INTERCAMBIO', W/2, 1000);

    return canvas;
  });
}

function downloadCertificate(){
  drawCertificate().then((canvas)=>{
    const link = document.createElement('a');
    const safeName = (state.studentName.trim()||'certificate').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
    link.download = `placement-certificate-${safeName}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}

function shareCertificateFile(){
  if(!navigator.canShare){ return; }
  drawCertificate().then((canvas)=>{
    canvas.toBlob((blob)=>{
      if(!blob) return;
      const safeName = (state.studentName.trim()||'certificate').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
      const file = new File([blob], `placement-certificate-${safeName}.png`, { type:'image/png' });
      if(navigator.canShare({ files:[file] })){
        navigator.share({ files:[file], title: t('certificateTitle') }).catch(()=>{});
      }
    }, 'image/png');
  });
}

/* ---------------- FLOW LOGIC ---------------- */
function startReading(){
  if(!state.studentName.trim()) return;
  state.screen="readingIntro";
  renderSectionIntro("reading");
}
function goToQuestion(){
  state.screen="reading";
  state.selected=null; state.locked=false;
  renderQuestion();
}
function startListening(){
  state.screen="listening";
  state.selected=null; state.locked=false;
  state.playCount=0;
  renderQuestion();
}

function selectOption(i){
  state.selected = i;
  renderQuestion();
}

function submitAnswer(){
  if(state.selected===null) return;

  // grade it silently — no correct/incorrect feedback is shown to the student
  const isListening = state.screen==="listening";
  const bank = isListening ? listeningQuestions : readingQuestions;
  const idx = isListening ? state.lIndex : state.rIndex;
  const q = bank[idx];
  const correct = state.selected === q.answer;

  if(isListening){
    state.lAnswered++;
    if(correct){ state.lScore += LISTENING_POINTS; } else { state.lWrong++; }
  } else {
    state.rAnswered++;
    if(correct){ state.rScore += READING_POINTS; } else { state.rWrong++; }
  }

  advance();
}

function advance(){
  state.selected=null;

  if(state.screen==="reading"){
    if(state.rWrong>=3 || state.rIndex+1>=readingQuestions.length){
      state.screen="listeningIntro";
      renderSectionIntro("listening");
      return;
    }
    state.rIndex++;
    renderQuestion();
  } else if(state.screen==="listening"){
    if(state.lWrong>=3 || state.lIndex+1>=listeningQuestions.length){
      state.screen="results";
      renderResults();
      return;
    }
    state.lIndex++;
    state.playCount=0;
    renderQuestion();
  }
}

/* ---------------- AUDIO ----------------
   Each question's audioFile points at your uploaded recording. If a file
   fails to load, a message appears under the question instead of silently
   doing nothing, so a broken file is easy to spot during setup or testing. */
if(!window.__audioEl){ window.__audioEl = new Audio(); }

function playAudio(){
  if(state.playCount >= 2) return;
  const q = listeningQuestions[state.lIndex];
  const btn = document.getElementById('playBtn');
  const noteEl = document.getElementById('audioNote');
  if(noteEl) noteEl.innerHTML = '';

  const audioEl = window.__audioEl;
  audioEl.pause();
  audioEl.onplay = null; audioEl.onended = null; audioEl.onerror = null;

  audioEl.src = q.audioFile;
  audioEl.onplay = ()=>{ btn.classList.add('playing'); btn.innerText='●'; };
  audioEl.onended = ()=>{ btn.classList.remove('playing'); btn.innerText='▶'; };
  audioEl.onerror = ()=>{
    btn.classList.remove('playing'); btn.innerText='▶';
    if(noteEl) noteEl.innerHTML = `${t('audioErrorPrefix')} <code>${q.audioFile}</code>. ${t('audioErrorSuffix')}`;
  };

  const playPromise = audioEl.play();
  if(playPromise && playPromise.catch){
    playPromise.catch(()=>{ audioEl.onerror(); });
  }
  state.hasPlayed = true;
  state.playCount++;

  // update the plays-left indicator and disable the button once exhausted,
  // without re-rendering the card (which would orphan the button mid-playback)
  const playsLeft = Math.max(0, 2 - state.playCount);
  const label = document.querySelector('.plays-left');
  if(label){
    label.textContent = t('playsLeftLabel').replace('{n}', playsLeft);
    label.classList.toggle('depleted', playsLeft<=0);
  }
  if(playsLeft<=0){
    btn.disabled = true;
    audioEl.onended = ()=>{ btn.classList.remove('playing'); btn.innerText='▶'; btn.disabled = true; };
  }
}

/* ---------------- INIT ---------------- */
renderIntro();

</script>
